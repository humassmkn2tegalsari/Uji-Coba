<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
    <meta name="theme-color" content="#000000">
    <title>E-Sarpras - SMKN 2 Tegalsari</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        :root {
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.3);
            --aero-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top left, #f0f4ff 0%, #ffffff 40%, #fdf2f8 100%);
            background-attachment: fixed;
            color: #1e293b;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--aero-shadow);
        }
        .aero-blur { backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); }
        .animate-float { animation: float 6s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .gradient-text {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .tap-scale { transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .tap-scale:active { transform: scale(0.95); }
        .animate-in { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .upload-area {
            position: relative; width: 100%; height: 150px;
            border: 2px dashed #cbd5e1; border-radius: 1.5rem;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            transition: all 0.3s ease; cursor: pointer;
        }
        .upload-area:hover { border-color: #f59e0b; background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%); transform: translateY(-2px); }
        .upload-area.has-image { border-style: solid; border-color: #10b981; }
        .upload-area img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
        .upload-placeholder { text-align: center; color: #64748b; z-index: 1; }
        .remove-photo-btn {
            position: absolute; top: 8px; right: 8px; width: 32px; height: 32px;
            background: rgba(244, 63, 94, 0.95); color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            backdrop-filter: blur(10px); z-index: 3; transition: transform 0.2s ease; border: 2px solid white;
        }
        .remove-photo-btn:hover { transform: scale(1.1); }

        .nav-btn { transition: all 0.3s ease; }
        .nav-btn.active { background: linear-gradient(135deg, #6366f1, #a855f7); color: white; box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4); }
        
        /* Table Styling */
        .table-container { overflow-x: auto; }
        .custom-table { width: 100%; border-collapse: separate; border-spacing: 0; }
        .custom-table th { background: rgba(99, 102, 241, 0.1); color: #4f46e5; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; padding: 12px; text-align: left; }
        .custom-table td { padding: 12px; font-size: 12px; font-weight: 600; color: #475569; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .custom-table tr:last-child td { border-bottom: none; }
    </style>
</head>
<body class="min-h-screen">

    <!-- TOAST NOTIFICATION -->
    <div id="statusToast" class="hidden fixed top-6 inset-x-4 z-[300] flex justify-center transform transition-all duration-300 pointer-events-none">
        <div id="toastContent" class="aero-blur bg-white/95 border px-6 py-4 rounded-3xl shadow-2xl flex items-center gap-3 pointer-events-auto">
            <i id="toastIcon" data-lucide="info" class="w-5 h-5"></i>
            <span id="toastMessage" class="font-bold text-sm tracking-tight text-slate-700">Pesan</span>
        </div>
    </div>

    <!-- HALAMAN LOGIN -->
    <div id="loginPage" class="min-h-screen flex items-center justify-center p-6">
        <div class="w-full max-w-md glass-card rounded-[3rem] p-10 space-y-10 relative overflow-hidden animate-in">
            <div class="absolute top-0 right-0 p-8 opacity-5"><i data-lucide="package" class="w-32 h-32"></i></div>
            <div class="text-center space-y-4">
                <div class="w-24 h-24 flex items-center justify-center mx-auto animate-float">
                    <img src="https://ui-avatars.com/api/?name=SMKN+2&background=6366f1&color=fff&size=128" alt="Logo" class="w-full h-full object-contain drop-shadow-2xl rounded-2xl">
                </div>
                <div class="space-y-1">
                    <h1 class="text-3xl font-black gradient-text tracking-tighter">E-Sarpras</h1>
                    <p class="text-slate-400 text-[11px] font-bold tracking-widest uppercase">SMK Negeri 2 Tegalsari</p>
                </div>
            </div>
            <div class="space-y-6">
                <div class="relative group">
                    <i data-lucide="user" class="absolute left-5 top-5 w-5 h-5 text-slate-400 group-focus-within:text-indigo-500 transition-colors"></i>
                    <input type="text" id="loginUser" class="w-full pl-14 pr-6 py-5 bg-white/30 border border-white/20 rounded-2xl text-sm font-bold focus:bg-white focus:ring-4 focus:ring-indigo-500/10 transition-all outline-none" placeholder="Username">
                </div>
                <div class="relative group">
                    <i data-lucide="key-round" class="absolute left-5 top-5 w-5 h-5 text-slate-400 group-focus-within:text-indigo-500 transition-colors"></i>
                    <input type="password" id="loginPass" class="w-full pl-14 pr-6 py-5 bg-white/30 border border-white/20 rounded-2xl text-sm font-bold focus:bg-white focus:ring-4 focus:ring-indigo-500/10 transition-all outline-none" placeholder="Password">
                </div>
                <button id="btnLogin" onclick="handleLogin()" class="tap-scale w-full py-5 bg-gradient-to-r from-indigo-600 to-indigo-700 text-white rounded-[2rem] font-black text-sm tracking-[0.2em] shadow-xl shadow-indigo-500/20 uppercase transition-all">Masuk Aplikasi</button>
            </div>
        </div>
    </div>

    <!-- HALAMAN UTAMA APLIKASI -->
    <div id="mainPage" class="hidden p-4 md:p-8 animate-in pb-24">
        <div class="max-w-4xl mx-auto space-y-6">
            <!-- Header -->
            <div class="flex items-center justify-between glass-card p-4 rounded-[2rem] sticky top-4 z-50">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-500 rounded-xl flex items-center justify-center text-white shadow-lg">
                        <i data-lucide="package" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <h1 id="displayNama" class="text-sm font-black text-slate-800 truncate max-w-[150px]">Memuat...</h1>
                        <p id="displayRole" class="text-[9px] font-bold text-slate-400 uppercase tracking-tight"></p>
                    </div>
                </div>
                <button onclick="handleLogout()" class="tap-scale w-10 h-10 flex items-center justify-center bg-rose-500/10 text-rose-500 rounded-xl hover:bg-rose-500/20 transition-colors">
                    <i data-lucide="power" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Menu Navigasi (Dinamis berdasarkan Role) -->
            <div id="navMenu" class="grid grid-cols-2 md:grid-cols-4 gap-3">
                <!-- Diisi oleh JavaScript -->
            </div>

            <!-- Konten Dinamis -->
            <div id="contentArea" class="glass-card rounded-[2.5rem] p-6 md:p-8 min-h-[400px]">
                <div class="text-center py-20 text-slate-400">
                    <i data-lucide="mouse-pointer-click" class="w-12 h-12 mx-auto mb-4 opacity-50"></i>
                    <p class="font-bold text-sm uppercase tracking-widest">Pilih menu di atas untuk memulai</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ GANTI URL INI DENGAN URL DEPLOYMENT GOOGLE APPS SCRIPT ANDA
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwkByXNRbGPzuL3cowoZgvqnZrm1O9rVtJUbOSlJTd1ArU5Og2IMWbIRCfmqzPFjWQafA/exec";
        
        let currentUser = null;
        let currentBase64Image = null;

        lucide.createIcons();

        // --- AUTHENTICATION ---
        async function handleLogin() {
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value.trim();
            const btn = document.getElementById('btnLogin');
            
            if (!user || !pass) return showToast("Mohon isi username dan password!", "rose");

            btn.disabled = true;
            btn.innerHTML = `<span class="animate-pulse">Menghubungkan...</span>`;

            try {
                const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=login&user=${encodeURIComponent(user)}&pass=${encodeURIComponent(pass)}`);
                const result = await response.json();
                
                if (result.status === "success") {
                    currentUser = result.data;
                    localStorage.setItem('sarpras_session', JSON.stringify(currentUser));
                    showMainPage();
                    showToast("Selamat Datang, " + currentUser.nama, "emerald");
                } else {
                    showToast(result.message || "Gagal Login!", "rose");
                }
            } catch (e) {
                showToast("Kesalahan Jaringan! Periksa URL Script.", "rose");
            } finally {
                btn.disabled = false;
                btn.innerText = "Masuk Aplikasi";
            }
        }

        function showMainPage() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('mainPage').classList.remove('hidden');
            document.getElementById('displayNama').innerText = currentUser.nama;
            document.getElementById('displayRole').innerText = currentUser.jabatan + " • " + currentUser.role.toUpperCase();
            renderNavMenu();
        }

        function handleLogout() {
            localStorage.removeItem('sarpras_session');
            currentUser = null;
            document.getElementById('mainPage').classList.add('hidden');
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('loginUser').value = "";
            document.getElementById('loginPass').value = "";
            showToast("Berhasil Logout", "emerald");
        }

        // --- NAVIGATION & ROUTING ---
        function renderNavMenu() {
            const nav = document.getElementById('navMenu');
            nav.innerHTML = '';
            
            const menus = [];
            if (currentUser.role === 'admin') {
                menus.push({ id: 'dashboard', label: 'Dashboard Data', icon: 'layout-dashboard' });
                menus.push({ id: 'inputBantuan', label: 'Input Bantuan', icon: 'gift' });
            }
            if (currentUser.role === 'bendahara' || currentUser.role === 'admin') {
                menus.push({ id: 'inputBarang', label: 'Input Barang/Bahan', icon: 'package-plus' });
            }
            if (currentUser.role === 'guru' || currentUser.role === 'admin' || currentUser.role === 'bendahara') {
                menus.push({ id: 'laporanRusak', label: 'Lapor Alat Rusak', icon: 'triangle-alert' });
                menus.push({ id: 'peminjaman', label: 'Peminjaman Barang', icon: 'hand-platter' });
            }

            menus.forEach((menu, index) => {
                const btn = document.createElement('button');
                btn.className = `nav-btn glass-card p-4 rounded-2xl flex flex-col items-center justify-center gap-2 text-slate-600 hover:bg-white/50 ${index === 0 ? 'active' : ''}`;
                btn.innerHTML = `<i data-lucide="${menu.icon}" class="w-6 h-6"></i><span class="text-[10px] font-black uppercase tracking-wider">${menu.label}</span>`;
                btn.onclick = () => loadView(menu.id, btn);
                nav.appendChild(btn);
            });
            lucide.createIcons();
            if(menus.length > 0) loadView(menus[0].id, nav.firstChild);
        }

        function loadView(viewId, activeBtn) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if(activeBtn) activeBtn.classList.add('active');
            
            const content = document.getElementById('contentArea');
            content.innerHTML = `<div class="flex flex-col items-center py-12 space-y-4"><div class="w-10 h-10 border-4 border-indigo-600 rounded-full border-t-transparent animate-spin"></div><p class="text-xs font-bold text-slate-400 uppercase">Memuat Data...</p></div>`;

            setTimeout(() => {
                if (viewId === 'dashboard') renderDashboard(content);
                else if (viewId === 'inputBarang') renderFormInputBarang(content);
                else if (viewId === 'laporanRusak') renderFormLaporanRusak(content);
                else if (viewId === 'peminjaman') renderFormPeminjaman(content);
                else if (viewId === 'inputBantuan') renderFormBantuan(content);
                lucide.createIcons();
            }, 500);
        }

        // --- VIEWS RENDERER ---
        function renderDashboard(container) {
            container.innerHTML = `
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-lg font-black text-slate-800">Dashboard Inventaris</h2>
                    <button onclick="exportTableToCSV('Inventaris')" class="tap-scale px-4 py-2 bg-emerald-500 text-white rounded-xl text-[10px] font-black uppercase tracking-wider flex items-center gap-2">
                        <i data-lucide="download" class="w-4 h-4"></i> Unduh CSV
                    </button>
                </div>
                <div class="table-container glass-card rounded-2xl p-2">
                    <table class="custom-table" id="tableInventaris">
                        <thead><tr><th>Tanggal</th><th>Nama</th><th>Kode</th><th>Sumber</th><th>Kondisi</th><th>Lokasi</th></tr></thead>
                        <tbody id="tbodyInventaris"><tr><td colspan="6" class="text-center py-8 text-slate-400">Memuat data...</td></tr></tbody>
                    </table>
                </div>
            `;
            fetchData("Inventaris", "tbodyInventaris", ["timestamp", "nama", "kode", "sumber_dana", "kondisi", "lokasi"]);
        }

        function renderFormInputBarang(container) {
            container.innerHTML = `
                <h2 class="text-lg font-black text-slate-800 mb-6 flex items-center gap-2"><i data-lucide="package-plus" class="w-5 h-5 text-indigo-500"></i> Input Pembelian Bahan/Alat</h2>
                <form onsubmit="submitInventaris(event)" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <select name="jenis" class="w-full px-4 py-3 bg-white/50 border border-slate-200 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-indigo-500/20" required>
                            <option value="Barang">Barang / Alat</option>
                            <option value="Bahan">Bahan Habis Pakai</option>
                        </select>
                        <input type="text" name="nama" placeholder="Nama Barang/Bahan" class="w-full px-4 py-3 bg-white/50 border border-slate-200 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-indigo-500/20" required>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="text" name="kode" placeholder="Kode Lengkap" class="w-full px-4 py-3 bg-white/50 border border-slate-200 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-indigo-500/20" required>
                        <input type="number" name="tahun" placeholder="Tahun Perolehan" class="w-full px-4 py-3 bg-white/50 border border-slate-200 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-indigo-500/20" required>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="text" name="merek" placeholder="Merek / Type" class="w-full px-4 py-3 bg-white/50 border border-slate-200 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-indigo-500/20" required>
                        <select name="sumber_dana" class="w-full px-4 py-3 bg-white/50 border border-slate-200 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-indigo-500/20" required>
                            <option value="BOS">BOS</option>
                            <option value="BPOPP">BPOPP</option>
                            <option value="PSM">PSM</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="number" name="harga" placeholder="Harga (Rp)" class="w-full px-4 py-3 bg-white/50 border border-slate-200 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-indigo-500/20" required>
                        <select name="kondisi" class="w-full px-4 py-3 bg-white/50 border border-slate-200 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-indigo-500/20" required>
                            <option value="Baik">Baik</option>
                            <option value="Rusak Ringan">Rusak Ringan</option>
                            <option value="Rusak Berat">Rusak Berat</option>
                        </select>
                    </div>
                    <input type="text" name="lokasi" placeholder="Lokasi Penempatan" class="w-full px-4 py-3 bg-white/50 border border-slate-200 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-indigo-500/20" required>
                    <textarea name="keterangan" placeholder="Keterangan Tambahan" rows="2" class="w-full px-4 py-3 bg-white/50 border border-slate-200 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-indigo-500/20"></textarea>
                    
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-slate-500 uppercase">Unggah Foto Barang/Bahan</label>
                        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                            <div class="upload-placeholder" id="uploadPlaceholder"><i data-lucide="camera" class="w-8 h-8 mx-auto mb-1"></i><p class="text-xs font-bold">Klik untuk upload foto</p></div>
                            <img id="previewImage" class="hidden">
                            <div class="remove-photo-btn hidden" id="removeBtn" onclick="removeImage(event)"><i data-lucide="x" class="w-4 h-4"></i></div>
                        </div>
                        <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
                    </div>

                    <button type="submit" class="tap-scale w-full py-4 bg-gradient-to-r from-indigo-600 to-indigo-700 text-white rounded-2xl font-black text-xs uppercase tracking-widest shadow-lg mt-4">Simpan Data</button>
                </form>
            `;
        }

        function renderFormLaporanRusak(container) {
            container.innerHTML = `
                <h2 class="text-lg font-black text-slate-800 mb-6 flex items-center gap-2"><i data-lucide="triangle-alert" class="w-5 h-5 text-rose-500"></i> Laporan Alat Rusak</h2>
                <form onsubmit="submitLaporanRusak(event)" class="space-y-4">
                    <input type="text" name="nama_barang" placeholder="Nama Barang Rusak" class="w-full px-4 py-3 bg-white/50 border border-slate-200 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-rose-500/20" required>
                    <input type="text" name="lokasi" placeholder="Lokasi Barang Rusak" class="w-full px-4 py-3 bg-white/50 border border-slate-200 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-rose-500/20" required>
                    
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-slate-500 uppercase">Unggah Foto Kerusakan</label>
                        <div class="upload-area" onclick="document.getElementById('fileRusak').click()">
                            <div class="upload-placeholder" id="uploadPlaceholderRusak"><i data-lucide="camera" class="w-8 h-8 mx-auto mb-1"></i><p class="text-xs font-bold">Klik untuk upload foto</p></div>
                            <img id="previewRusak" class="hidden">
                            <div class="remove-photo-btn hidden" id="removeBtnRusak" onclick="removeImageRusak(event)"><i data-lucide="x" class="w-4 h-4"></i></div>
                        </div>
                        <input type="file" id="fileRusak" accept="image/*" class="hidden" onchange="handleFileSelectRusak(event)">
                    </div>

                    <button type="submit" class="tap-scale w-full py-4 bg-gradient-to-r from-rose-500 to-rose-600 text-white rounded-2xl font-black text-xs uppercase tracking-widest shadow-lg mt-4">Kirim Laporan</button>
                </form>
            `;
        }

        function renderFormPeminjaman(container) {
            container.innerHTML = `
                <h2 class="text-lg font-black text-slate-800 mb-6 flex items-center gap-2"><i data-lucide="hand-platter" class="w-5 h-5 text-amber-500"></i> Peminjaman Barang</h2>
                <form onsubmit="submitPeminjaman(event)" class="space-y-4">
                    <input type="text" name="nama_alat" placeholder="Nama Alat yang Dipinjam" class="w-full px-4 py-3 bg-white/50 border border-slate-200 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-amber-500/20" required>
                    <select name="keterangan_peminjam" class="w-full px-4 py-3 bg-white/50 border border-slate-200 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-amber-500/20" required>
                        <option value="Guru">Guru</option>
                        <option value="Eksternal">Eksternal</option>
                    </select>
                    
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-slate-500 uppercase">Unggah Foto Barang Saat Dipinjam</label>
                        <div class="upload-area" onclick="document.getElementById('filePinjam').click()">
                            <div class="upload-placeholder" id="uploadPlaceholderPinjam"><i data-lucide="camera" class="w-8 h-8 mx-auto mb-1"></i><p class="text-xs font-bold">Klik untuk upload foto</p></div>
                            <img id="previewPinjam" class="hidden">
                            <div class="remove-photo-btn hidden" id="removeBtnPinjam" onclick="removeImagePinjam(event)"><i data-lucide="x" class="w-4 h-4"></i></div>
                        </div>
                        <input type="file" id="filePinjam" accept="image/*" class="hidden" onchange="handleFileSelectPinjam(event)">
                    </div>

                    <button type="submit" class="tap-scale w-full py-4 bg-gradient-to-r from-amber-500 to-orange-500 text-white rounded-2xl font-black text-xs uppercase tracking-widest shadow-lg mt-4">Ajukan Peminjaman</button>
                </form>
            `;
        }

        function renderFormBantuan(container) {
            container.innerHTML = `
                <h2 class="text-lg font-black text-slate-800 mb-6 flex items-center gap-2"><i data-lucide="gift" class="w-5 h-5 text-emerald-500"></i> Input Bantuan Sarpras</h2>
                <form onsubmit="submitBantuan(event)" class="space-y-4">
                    <input type="text" name="nama_barang" placeholder="Nama Barang" class="w-full px-4 py-3 bg-white/50 border border-slate-200 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-emerald-500/20" required>
                    <div class="grid grid-cols-2 gap-4">
                        <input type="number" name="tahun" placeholder="Tahun Perolehan" class="w-full px-4 py-3 bg-white/50 border border-slate-200 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-emerald-500/20" required>
                        <input type="text" name="merek" placeholder="Merek / Tipe" class="w-full px-4 py-3 bg-white/50 border border-slate-200 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-emerald-500/20" required>
                    </div>
                    <select name="sumber_bantuan" class="w-full px-4 py-3 bg-white/50 border border-slate-200 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-emerald-500/20" required>
                        <option value="Pemerintah">Bantuan Pemerintah</option>
                        <option value="Hibah Sekolah Lain">Hibah Sekolah Lain</option>
                        <option value="Lainnya">Lainnya</option>
                    </select>
                    <select name="kondisi" class="w-full px-4 py-3 bg-white/50 border border-slate-200 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-emerald-500/20" required>
                        <option value="Baik">Baik</option>
                        <option value="Perlu Perbaikan">Perlu Perbaikan</option>
                    </select>
                    <input type="text" name="lokasi" placeholder="Lokasi Penempatan" class="w-full px-4 py-3 bg-white/50 border border-slate-200 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-emerald-500/20" required>
                    
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-slate-500 uppercase">Unggah Foto Barang</label>
                        <div class="upload-area" onclick="document.getElementById('fileBantuan').click()">
                            <div class="upload-placeholder" id="uploadPlaceholderBantuan"><i data-lucide="camera" class="w-8 h-8 mx-auto mb-1"></i><p class="text-xs font-bold">Klik untuk upload foto</p></div>
                            <img id="previewBantuan" class="hidden">
                            <div class="remove-photo-btn hidden" id="removeBtnBantuan" onclick="removeImageBantuan(event)"><i data-lucide="x" class="w-4 h-4"></i></div>
                        </div>
                        <input type="file" id="fileBantuan" accept="image/*" class="hidden" onchange="handleFileSelectBantuan(event)">
                    </div>

                    <button type="submit" class="tap-scale w-full py-4 bg-gradient-to-r from-emerald-500 to-emerald-600 text-white rounded-2xl font-black text-xs uppercase tracking-widest shadow-lg mt-4">Simpan Data Bantuan</button>
                </form>
            `;
        }

        // --- FILE HANDLING ---
        function handleFileSelect(event) { processImage(event, 'previewImage', 'removeBtn', 'uploadPlaceholder'); }
        function handleFileSelectRusak(event) { processImage(event, 'previewRusak', 'removeBtnRusak', 'uploadPlaceholderRusak'); }
        function handleFileSelectPinjam(event) { processImage(event, 'previewPinjam', 'removeBtnPinjam', 'uploadPlaceholderPinjam'); }
        function handleFileSelectBantuan(event) { processImage(event, 'previewBantuan', 'removeBtnBantuan', 'uploadPlaceholderBantuan'); }

        function processImage(event, previewId, removeId, placeholderId) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                currentBase64Image = e.target.result; // Simpan ke variabel global sementara
                document.getElementById(previewId).src = currentBase64Image;
                document.getElementById(previewId).classList.remove('hidden');
                document.getElementById(removeId).classList.remove('hidden');
                document.getElementById(placeholderId).classList.add('hidden');
                event.target.parentElement.classList.add('has-image');
            };
            reader.readAsDataURL(file);
        }

        function removeImage(e) { resetImage(e, 'previewImage', 'removeBtn', 'uploadPlaceholder', 'fileInput'); }
        function removeImageRusak(e) { resetImage(e, 'previewRusak', 'removeBtnRusak', 'uploadPlaceholderRusak', 'fileRusak'); }
        function removeImagePinjam(e) { resetImage(e, 'previewPinjam', 'removeBtnPinjam', 'uploadPlaceholderPinjam', 'filePinjam'); }
        function removeImageBantuan(e) { resetImage(e, 'previewBantuan', 'removeBtnBantuan', 'uploadPlaceholderBantuan', 'fileBantuan'); }

        function resetImage(e, previewId, removeId, placeholderId, inputId) {
            e.stopPropagation();
            currentBase64Image = null;
            document.getElementById(previewId).classList.add('hidden');
            document.getElementById(removeId).classList.add('hidden');
            document.getElementById(placeholderId).classList.remove('hidden');
            document.getElementById(inputId).value = '';
            document.getElementById(inputId).parentElement.classList.remove('has-image');
        }

        // --- SUBMISSION LOGIC ---
        async function submitInventaris(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            data.action = "inputInventaris";
            data.foto_barang = currentBase64Image || "";
            data.foto_bukti = ""; // Bisa ditambahkan input file kedua jika perlu
            data.input_oleh = currentUser.nama;
            await sendData(data, "Data berhasil diinput ke Inventaris!", "emerald");
            e.target.reset(); resetImage({stopPropagation:()=>{}}, 'previewImage', 'removeBtn', 'uploadPlaceholder', 'fileInput');
        }

        async function submitLaporanRusak(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            data.action = "laporanRusak";
            data.foto_rusak = currentBase64Image || "";
            data.pelapor = currentUser.nama;
            await sendData(data, "Laporan kerusakan berhasil dikirim!", "rose");
            e.target.reset(); resetImage({stopPropagation:()=>{}}, 'previewRusak', 'removeBtnRusak', 'uploadPlaceholderRusak', 'fileRusak');
        }

        async function submitPeminjaman(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            data.action = "peminjaman";
            data.foto_barang = currentBase64Image || "";
            data.peminjam = currentUser.nama;
            await sendData(data, "Alat yang sudah dipinjam dapat dirawat dan dikembalikan segera maksimal 2 hari setelah peminjaman.", "amber");
            e.target.reset(); resetImage({stopPropagation:()=>{}}, 'previewPinjam', 'removeBtnPinjam', 'uploadPlaceholderPinjam', 'filePinjam');
        }

        async function submitBantuan(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            data.action = "inputBantuan";
            data.foto_barang = currentBase64Image || "";
            data.input_oleh = currentUser.nama;
            await sendData(data, "Data bantuan berhasil disimpan!", "emerald");
            e.target.reset(); resetImage({stopPropagation:()=>{}}, 'previewBantuan', 'removeBtnBantuan', 'uploadPlaceholderBantuan', 'fileBantuan');
        }

        async function sendData(payload, successMsg, color) {
            const btn = event.target.querySelector('button[type="submit"]');
            const originalText = btn.innerText;
            btn.disabled = true;
            btn.innerHTML = `<span class="animate-pulse">Menyimpan...</span>`;

            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await response.json();
                if (result.status === "success") {
                    showToast(successMsg, color);
                } else {
                    showToast("Gagal: " + result.message, "rose");
                }
            } catch (err) {
                showToast("Gagal terhubung ke server!", "rose");
            } finally {
                btn.disabled = false;
                btn.innerText = originalText;
            }
        }

        // --- DATA FETCHING & UTILS ---
        async function fetchData(sheetName, tbodyId, columns) {
            try {
                const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=getData&sheet=${sheetName}`);
                const result = await res.json();
                const tbody = document.getElementById(tbodyId);
                tbody.innerHTML = '';
                
                if (result.status === "success" && result.data.length > 0) {
                    // Ambil 10 data terbaru
                    const recentData = result.data.slice(-10).reverse();
                    recentData.forEach(row => {
                        const tr = document.createElement('tr');
                        columns.forEach(col => {
                            const td = document.createElement('td');
                            let val = row[col] || '-';
                            if (col === 'timestamp' && val !== '-') {
                                val = new Date(val).toLocaleDateString('id-ID');
                            }
                            td.innerText = val;
                            tr.appendChild(td);
                        });
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="${columns.length}" class="text-center py-8 text-slate-400 text-xs font-bold">Belum ada data</td></tr>`;
                }
            } catch (e) {
                console.error(e);
            }
        }

        function exportTableToCSV(sheetName) {
            fetchData(sheetName, 'dummy', []); // Pastikan data ter-load (simplified)
            showToast("Fitur unduh CSV sedang memproses data...", "emerald");
            // Implementasi CSV export lengkap bisa ditambahkan di sini dengan mengambil semua data
        }

        function showToast(message, color) {
            const toast = document.getElementById('statusToast');
            const content = document.getElementById('toastContent');
            const icon = document.getElementById('toastIcon');
            document.getElementById('toastMessage').textContent = message;
            
            if (color === 'emerald') {
                content.className = "aero-blur bg-white/95 border border-emerald-500/20 px-6 py-4 rounded-3xl shadow-2xl flex items-center gap-3 text-emerald-600";
                icon.setAttribute('data-lucide', 'check-circle');
            } else if (color === 'amber') {
                content.className = "aero-blur bg-white/95 border border-amber-500/20 px-6 py-4 rounded-3xl shadow-2xl flex items-center gap-3 text-amber-600";
                icon.setAttribute('data-lucide', 'alert-triangle');
            } else {
                content.className = "aero-blur bg-white/95 border border-rose-500/20 px-6 py-4 rounded-3xl shadow-2xl flex items-center gap-3 text-rose-600";
                icon.setAttribute('data-lucide', 'alert-circle');
            }
            lucide.createIcons();
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 4000);
        }

        // --- INIT ---
        window.onload = () => {
            const saved = localStorage.getItem('sarpras_session');
            if (saved) {
                currentUser = JSON.parse(saved);
                showMainPage();
            }
        };
    </script>
</body>
</html>
