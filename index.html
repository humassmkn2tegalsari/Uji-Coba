<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
    <meta name="theme-color" content="#000000">
    <title>E-Sarpras - SMKN 2 Tegalsari</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        :root {
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.3);
            --aero-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top left, #f0f4ff 0%, #ffffff 40%, #fdf2f8 100%);
            background-attachment: fixed; color: #1e293b; overflow-x: hidden; -webkit-tap-highlight-color: transparent;
        }
        .glass-card {
            background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border); box-shadow: var(--aero-shadow);
        }
        .aero-blur { backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); }
        .animate-float { animation: float 6s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .gradient-text { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .tap-scale { transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .tap-scale:active { transform: scale(0.95); }
        .animate-in { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .upload-area {
            position: relative; width: 100%; min-height: 120px;
            border: 2px dashed #cbd5e1; border-radius: 1.5rem;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            transition: all 0.3s ease; cursor: pointer; flex-wrap: wrap; padding: 10px; gap: 10px;
        }
        .upload-area:hover { border-color: #f59e0b; background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%); }
        .upload-placeholder { text-align: center; color: #64748b; z-index: 1; width: 100%; }
        
        .preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; width: 100%; }
        .preview-item { position: relative; width: 100%; aspect-ratio: 1; border-radius: 0.75rem; overflow: hidden; border: 2px solid #10b981; }
        .preview-item img { width: 100%; height: 100%; object-fit: cover; }
        .remove-photo-btn {
            position: absolute; top: 4px; right: 4px; width: 24px; height: 24px;
            background: rgba(244, 63, 94, 0.95); color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 3;
        }

        .nav-btn { transition: all 0.3s ease; }
        .nav-btn.active { background: linear-gradient(135deg, #6366f1, #a855f7); color: white; box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4); }
        
        .table-container { overflow-x: auto; }
        .custom-table { width: 100%; border-collapse: separate; border-spacing: 0; }
        .custom-table th { background: rgba(99, 102, 241, 0.1); color: #4f46e5; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; padding: 12px; text-align: left; position: sticky; top: 0; }
        .custom-table td { padding: 12px; font-size: 12px; font-weight: 600; color: #475569; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .custom-table tr:hover td { background: rgba(99, 102, 241, 0.03); }

        .tab-btn {
            padding: 0.75rem 1.5rem; border-radius: 1rem; font-weight: 800; font-size: 0.75rem;
            text-transform: uppercase; letter-spacing: 0.05em; transition: all 0.3s ease;
            background: rgba(255,255,255,0.5); color: #64748b;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #6366f1, #a855f7); color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }
        .tab-btn:hover:not(.active) { background: rgba(255,255,255,0.8); color: #4f46e5; }
        
        input[type="date"] { color: #475569; }
        input[type="date"]::-webkit-calendar-picker-indicator { cursor: pointer; opacity: 0.6; transition: 0.2s; }
        input[type="date"]::-webkit-calendar-picker-indicator:hover { opacity: 1; }
    </style>
</head>
<body class="min-h-screen">

    <div id="statusToast" class="hidden fixed top-6 inset-x-4 z-[300] flex justify-center transform transition-all duration-300 pointer-events-none">
        <div id="toastContent" class="aero-blur bg-white/95 border px-6 py-4 rounded-3xl shadow-2xl flex items-center gap-3 pointer-events-auto">
            <i id="toastIcon" data-lucide="info" class="w-5 h-5"></i>
            <span id="toastMessage" class="font-bold text-sm tracking-tight text-slate-700">Pesan</span>
        </div>
    </div>

    <div id="loginPage" class="min-h-screen flex items-center justify-center p-6">
        <div class="w-full max-w-md glass-card rounded-[3rem] p-10 space-y-10 relative overflow-hidden animate-in">
            <div class="absolute top-0 right-0 p-8 opacity-5"><i data-lucide="package" class="w-32 h-32"></i></div>
            <div class="text-center space-y-4">
                <div class="w-32 h-32 flex items-center justify-center mx-auto animate-float">
                    <img src="https://lh3.googleusercontent.com/d/15zyF01OHtEgTl8p6bvEkz7xw30ByE2en" alt="Logo Sekolah" class="w-full h-full object-contain drop-shadow-2xl" onerror="this.src='https://ui-avatars.com/api/?name=SMK&background=6366f1&color=fff'">
                </div>
                <div class="space-y-1">
                    <h1 class="text-3xl font-black gradient-text tracking-tighter">E-Sarpras</h1>
                    <p class="text-slate-400 text-[11px] font-bold tracking-widest uppercase">SMK Negeri 2 Tegalsari</p>
                </div>
            </div>
            <div class="space-y-6">
                <div class="relative group">
                    <i data-lucide="user" class="absolute left-5 top-5 w-5 h-5 text-slate-400 group-focus-within:text-indigo-500 transition-colors"></i>
                    <input type="text" id="loginUser" class="w-full pl-14 pr-6 py-5 bg-white/30 border border-white/20 rounded-2xl text-sm font-bold focus:bg-white focus:ring-4 focus:ring-indigo-500/10 transition-all outline-none" placeholder="Username">
                </div>
                <div class="relative group">
                    <i data-lucide="key-round" class="absolute left-5 top-5 w-5 h-5 text-slate-400 group-focus-within:text-indigo-500 transition-colors"></i>
                    <input type="password" id="loginPass" class="w-full pl-14 pr-6 py-5 bg-white/30 border border-white/20 rounded-2xl text-sm font-bold focus:bg-white focus:ring-4 focus:ring-indigo-500/10 transition-all outline-none" placeholder="Password">
                </div>
                <button id="btnLogin" onclick="handleLogin()" class="tap-scale w-full py-5 bg-gradient-to-r from-indigo-600 to-indigo-700 text-white rounded-[2rem] font-black text-sm tracking-[0.2em] shadow-xl shadow-indigo-500/20 uppercase transition-all">Masuk Aplikasi</button>
            </div>
        </div>
    </div>

    <div id="mainPage" class="hidden p-4 md:p-8 animate-in pb-24">
        <div class="max-w-6xl mx-auto space-y-6">
            <div class="flex items-center justify-between glass-card p-4 rounded-[2rem] sticky top-4 z-50">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-500 rounded-xl flex items-center justify-center text-white shadow-lg">
                        <i data-lucide="package" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <h1 id="displayNama" class="text-sm font-black text-slate-800 truncate max-w-[150px]">Memuat...</h1>
                        <p id="displayRole" class="text-[9px] font-bold text-slate-400 uppercase tracking-tight"></p>
                    </div>
                </div>
                <button onclick="handleLogout()" class="tap-scale w-10 h-10 flex items-center justify-center bg-rose-500/10 text-rose-500 rounded-xl hover:bg-rose-500/20 transition-colors">
                    <i data-lucide="power" class="w-5 h-5"></i>
                </button>
            </div>

            <div id="navMenu" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3"></div>

            <div id="contentArea" class="glass-card rounded-[2.5rem] p-6 md:p-8 min-h-[400px]"></div>
        </div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyXRemajtn6rBJZHURRdWfAIcefQAFBbGR9LGh-3FHwyrePxcy1hMtKHPtP-XMcXomJmg/exec";
        
        let currentUser = null;
        let currentImagesBase64 = []; 
        let currentBuktiBase64 = "";  
        let allInventoryData = [];
        let allBantuanData = [];
        let allRusakData = [];
        let allPeminjamanData = [];
        let allPengeluaranData = [];

        lucide.createIcons();

        // Format tanggal untuk tampilan (YYYY-MM-DD atau Date object → DD/MM/YYYY)
        function formatTanggalID(dateStr) {
            if (!dateStr) return "-";
            const str = String(dateStr).replace(/^'/, ''); // Hapus apostrof jika ada
            const match = str.match(/^(\d{4})-(\d{2})-(\d{2})/);
            if (match) {
                return `${match[3]}/${match[2]}/${match[1]}`;
            }
            try {
                const d = new Date(dateStr);
                if (!isNaN(d.getTime())) {
                    const day = String(d.getDate()).padStart(2, '0');
                    const month = String(d.getMonth() + 1).padStart(2, '0');
                    const year = d.getFullYear();
                    return `${day}/${month}/${year}`;
                }
            } catch (e) {}
            return String(dateStr);
        }

        // Ambil bagian YYYY-MM-DD dari berbagai format
        function getDateString(dateVal) {
            if (!dateVal) return "";
            const str = String(dateVal).replace(/^'/, '');
            const match = str.match(/^(\d{4})-(\d{2})-(\d{2})/);
            if (match) return match[0];
            try {
                const d = new Date(dateVal);
                if (!isNaN(d.getTime())) {
                    const y = d.getFullYear();
                    const m = String(d.getMonth() + 1).padStart(2, '0');
                    const day = String(d.getDate()).padStart(2, '0');
                    return `${y}-${m}-${day}`;
                }
            } catch (e) {}
            return str;
        }

        async function handleLogin() {
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value.trim();
            const btn = document.getElementById('btnLogin');
            if (!user || !pass) return showToast("Mohon isi username dan password!", "rose");

            btn.disabled = true; btn.innerHTML = `<span class="animate-pulse">Menghubungkan...</span>`;
            try {
                const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=login&user=${encodeURIComponent(user)}&pass=${encodeURIComponent(pass)}`);
                const result = await response.json();
                if (result.status === "success") {
                    currentUser = result.data;
                    localStorage.setItem('sarpras_session', JSON.stringify(currentUser));
                    showMainPage();
                    showToast("Selamat Datang, " + currentUser.nama, "emerald");
                } else {
                    showToast(result.message || "Gagal Login!", "rose");
                }
            } catch (e) {
                showToast("Kesalahan Jaringan!", "rose");
            } finally {
                btn.disabled = false; btn.innerText = "Masuk Aplikasi";
            }
        }

        function showMainPage() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('mainPage').classList.remove('hidden');
            document.getElementById('displayNama').innerText = currentUser.nama;
            document.getElementById('displayRole').innerText = currentUser.jabatan + " • " + currentUser.role.toUpperCase();
            renderNavMenu();
        }

        function handleLogout() {
            localStorage.removeItem('sarpras_session');
            currentUser = null;
            document.getElementById('mainPage').classList.add('hidden');
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('loginUser').value = "";
            document.getElementById('loginPass').value = "";
            showToast("Berhasil Logout", "emerald");
        }

        function renderNavMenu() {
            const nav = document.getElementById('navMenu');
            nav.innerHTML = '';
            const menus = [];
            
            if (currentUser.role === 'admin') {
                menus.push({ id: 'dashboard', label: 'Dashboard Data', icon: 'layout-dashboard' });
                menus.push({ id: 'inputBantuan', label: 'Input Bantuan', icon: 'gift' });
            }
            if (currentUser.role === 'bendahara' || currentUser.role === 'admin') {
                menus.push({ id: 'inputBarang', label: 'Input Barang/Bahan', icon: 'package-plus' });
            }
            menus.push({ id: 'laporanRusak', label: 'Lapor Alat Rusak', icon: 'triangle-alert' });
            menus.push({ id: 'peminjaman', label: 'Peminjaman Barang', icon: 'hand-platter' });
            menus.push({ id: 'pengeluaran', label: 'Pengeluaran Barang', icon: 'package-minus' });

            const order = ['dashboard', 'inputBarang', 'inputBantuan', 'laporanRusak', 'peminjaman', 'pengeluaran'];
            menus.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));

            menus.forEach((menu, index) => {
                const btn = document.createElement('button');
                btn.className = `nav-btn glass-card p-4 rounded-2xl flex flex-col items-center justify-center gap-2 text-slate-600 hover:bg-white/50 ${index === 0 ? 'active' : ''}`;
                btn.innerHTML = `<i data-lucide="${menu.icon}" class="w-6 h-6"></i><span class="text-[10px] font-black uppercase tracking-wider text-center leading-tight">${menu.label}</span>`;
                btn.onclick = () => loadView(menu.id, btn);
                nav.appendChild(btn);
            });
            lucide.createIcons();
            if(menus.length > 0) loadView(menus[0].id, nav.firstChild);
        }

        function loadView(viewId, activeBtn) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if(activeBtn) activeBtn.classList.add('active');
            
            const content = document.getElementById('contentArea');
            content.innerHTML = `<div class="flex flex-col items-center py-12 space-y-4"><div class="w-10 h-10 border-4 border-indigo-600 rounded-full border-t-transparent animate-spin"></div><p class="text-xs font-bold text-slate-400 uppercase">Memuat Data...</p></div>`;

            setTimeout(() => {
                if (viewId === 'dashboard') renderDashboard(content);
                else if (viewId === 'inputBarang') renderFormInputBarang(content);
                else if (viewId === 'laporanRusak') renderFormLaporanRusak(content);
                else if (viewId === 'peminjaman') renderFormPeminjaman(content);
                else if (viewId === 'inputBantuan') renderFormBantuan(content);
                else if (viewId === 'pengeluaran') renderFormPengeluaran(content);
                lucide.createIcons();
            }, 300);
        }

        function renderDashboard(container) {
            container.innerHTML = `
                <div class="flex flex-col md:flex-row md:items-center justify-between mb-6 gap-4">
                    <h2 class="text-lg font-black text-slate-800 flex items-center gap-2"><i data-lucide="layout-dashboard" class="w-5 h-5 text-indigo-500"></i> Dashboard Data</h2>
                </div>
                <div class="flex flex-wrap gap-2 mb-6 p-2 bg-white/30 rounded-2xl overflow-x-auto">
                    <button onclick="switchDashboardTab('inventaris')" id="tab-inventaris" class="tab-btn active flex items-center gap-2 whitespace-nowrap"><i data-lucide="package" class="w-4 h-4"></i> Inventaris</button>
                    <button onclick="switchDashboardTab('bantuan')" id="tab-bantuan" class="tab-btn flex items-center gap-2 whitespace-nowrap"><i data-lucide="gift" class="w-4 h-4"></i> Bantuan</button>
                    <button onclick="switchDashboardTab('rusak')" id="tab-rusak" class="tab-btn flex items-center gap-2 whitespace-nowrap"><i data-lucide="triangle-alert" class="w-4 h-4"></i> Barang Rusak</button>
                    <button onclick="switchDashboardTab('peminjaman')" id="tab-peminjaman" class="tab-btn flex items-center gap-2 whitespace-nowrap"><i data-lucide="hand-platter" class="w-4 h-4"></i> Peminjaman</button>
                    <button onclick="switchDashboardTab('pengeluaran')" id="tab-pengeluaran" class="tab-btn flex items-center gap-2 whitespace-nowrap"><i data-lucide="package-minus" class="w-4 h-4"></i> Pengeluaran</button>
                </div>
                <div id="dashboardContent"></div>
            `;
            switchDashboardTab('inventaris');
            lucide.createIcons();
        }

        function switchDashboardTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            
            const content = document.getElementById('dashboardContent');
            content.innerHTML = `<div class="flex flex-col items-center py-12 space-y-4"><div class="w-10 h-10 border-4 border-indigo-600 rounded-full border-t-transparent animate-spin"></div><p class="text-xs font-bold text-slate-400 uppercase">Memuat Data...</p></div>`;
            
            setTimeout(() => {
                if (tab === 'inventaris') renderInventarisDashboard(content);
                else if (tab === 'bantuan') renderBantuanDashboard(content);
                else if (tab === 'rusak') renderRusakDashboard(content);
                else if (tab === 'peminjaman') renderPeminjamanDashboard(content);
                else if (tab === 'pengeluaran') renderPengeluaranDashboard(content);
                lucide.createIcons();
            }, 200);
        }

        function renderInventarisDashboard(container) {
            container.innerHTML = `
                <div class="flex flex-col md:flex-row md:items-center justify-between mb-6 gap-4">
                    <h3 class="text-base font-black text-slate-800 flex items-center gap-2"><i data-lucide="package" class="w-5 h-5 text-indigo-500"></i> Dashboard Inventaris</h3>
                    <button onclick="exportToExcel('Inventaris')" class="tap-scale px-4 py-2.5 bg-emerald-600 text-white rounded-xl text-[10px] font-black uppercase tracking-wider flex items-center gap-2 shadow-lg shadow-emerald-500/20">
                        <i data-lucide="file-spreadsheet" class="w-4 h-4"></i> Unduh Excel
                    </button>
                </div>
                <div class="glass-card p-4 rounded-2xl mb-6 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3">
                    <input type="text" id="filterNama" placeholder="Cari Nama..." oninput="applyFilter('inventaris')" class="px-3 py-2 bg-white/50 border border-slate-200 rounded-lg text-xs font-bold outline-none focus:ring-2 focus:ring-indigo-500/20">
                    <select id="filterTanggal" onchange="applyFilter('inventaris')" class="px-3 py-2 bg-white/50 border border-slate-200 rounded-lg text-xs font-bold outline-none"><option value="">Semua Tanggal</option></select>
                    <select id="filterSumber" onchange="applyFilter('inventaris')" class="px-3 py-2 bg-white/50 border border-slate-200 rounded-lg text-xs font-bold outline-none"><option value="">Semua Sumber</option><option value="BOS">BOS</option><option value="BPOPP">BPOPP</option><option value="PSM">PSM</option></select>
                    <select id="filterKondisi" onchange="applyFilter('inventaris')" class="px-3 py-2 bg-white/50 border border-slate-200 rounded-lg text-xs font-bold outline-none"><option value="">Semua Kondisi</option><option value="Baik">Baik</option><option value="Rusak Ringan">Rusak Ringan</option><option value="Rusak Berat">Rusak Berat</option></select>
                    <input type="text" id="filterLokasi" placeholder="Cari Lokasi..." oninput="applyFilter('inventaris')" class="px-3 py-2 bg-white/50 border border-slate-200 rounded-lg text-xs font-bold outline-none focus:ring-2 focus:ring-indigo-500/20">
                    <button onclick="resetFilter('inventaris')" class="px-3 py-2 bg-slate-200 text-slate-600 rounded-lg text-xs font-black uppercase hover:bg-slate-300 transition">Reset</button>
                </div>
                <div class="table-container glass-card rounded-2xl p-2 max-h-[500px] overflow-y-auto">
                    <table class="custom-table" id="tableInventaris">
                        <thead><tr><th>Tanggal</th><th>Jenis</th><th>Nama</th><th>Kode</th><th>Tgl. Perolehan</th><th>Sumber</th><th>Harga</th><th>Kondisi</th><th>Lokasi</th><th>Bukti</th><th>Foto</th></tr></thead>
                        <tbody id="tbodyInventaris"><tr><td colspan="11" class="text-center py-8 text-slate-400">Memuat data...</td></tr></tbody>
                    </table>
                </div>
            `;
            fetchInventoryData();
        }

        function renderBantuanDashboard(container) {
            container.innerHTML = `
                <div class="flex flex-col md:flex-row md:items-center justify-between mb-6 gap-4">
                    <h3 class="text-base font-black text-slate-800 flex items-center gap-2"><i data-lucide="gift" class="w-5 h-5 text-emerald-500"></i> Dashboard Bantuan</h3>
                    <button onclick="exportToExcel('Bantuan')" class="tap-scale px-4 py-2.5 bg-emerald-600 text-white rounded-xl text-[10px] font-black uppercase tracking-wider flex items-center gap-2 shadow-lg shadow-emerald-500/20">
                        <i data-lucide="file-spreadsheet" class="w-4 h-4"></i> Unduh Excel
                    </button>
                </div>
                <div class="glass-card p-4 rounded-2xl mb-6 grid grid-cols-2 md:grid-cols-4 gap-3">
                    <input type="text" id="filterBantuanNama" placeholder="Cari Nama..." oninput="applyFilter('bantuan')" class="px-3 py-2 bg-white/50 border border-slate-200 rounded-lg text-xs font-bold outline-none focus:ring-2 focus:ring-emerald-500/20">
                    <select id="filterBantuanTanggal" onchange="applyFilter('bantuan')" class="px-3 py-2 bg-white/50 border border-slate-200 rounded-lg text-xs font-bold outline-none"><option value="">Semua Tanggal</option></select>
                    <select id="filterBantuanSumber" onchange="applyFilter('bantuan')" class="px-3 py-2 bg-white/50 border border-slate-200 rounded-lg text-xs font-bold outline-none"><option value="">Semua Sumber</option><option value="Pemerintah">Pemerintah</option><option value="Hibah Sekolah Lain">Hibah Sekolah Lain</option></select>
                    <button onclick="resetFilter('bantuan')" class="px-3 py-2 bg-slate-200 text-slate-600 rounded-lg text-xs font-black uppercase hover:bg-slate-300 transition">Reset</button>
                </div>
                <div class="table-container glass-card rounded-2xl p-2 max-h-[500px] overflow-y-auto">
                    <table class="custom-table" id="tableBantuan">
                        <thead><tr><th>Tanggal</th><th>Nama Barang</th><th>Tgl. Perolehan</th><th>Merek</th><th>Sumber</th><th>Kondisi</th><th>Lokasi</th><th>Foto</th></tr></thead>
                        <tbody id="tbodyBantuan"><tr><td colspan="8" class="text-center py-8 text-slate-400">Memuat data...</td></tr></tbody>
                    </table>
                </div>
            `;
            fetchBantuanData();
        }

        function renderRusakDashboard(container) {
            container.innerHTML = `

        async function fetchInventoryData() {
            try {
                const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=getData&sheet=Inventaris`);
                const result = await res.json();
                if (result.status === "success") {
                    allInventoryData = result.data;
                    populateDateOptions('filterTanggal', allInventoryData, 'tanggal_perolehan');
                    applyFilter('inventaris');
                }
            } catch (e) { document.getElementById('tbodyInventaris').innerHTML = `<tr><td colspan="11" class="text-center py-8 text-rose-500 font-bold">Gagal memuat data</td></tr>`; }
        }

        function populateDateOptions(selectId, data, dateField) {
            const select = document.getElementById(selectId);
            if (!select) return;
            select.innerHTML = '<option value="">Semua Tanggal</option>';
            const dates = [...new Set(data.map(d => getDateString(d[dateField])).filter(Boolean))].sort().reverse();
            dates.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d; 
                opt.innerText = formatTanggalID(d);
                select.appendChild(opt);
            });
        }

        function applyFilter(type) {
            if (type === 'inventaris') {
                const f = {
                    nama: document.getElementById('filterNama').value.toLowerCase(),
                    tanggal: document.getElementById('filterTanggal').value,
                    sumber: document.getElementById('filterSumber').value,
                    kondisi: document.getElementById('filterKondisi').value,
                    lokasi: document.getElementById('filterLokasi').value.toLowerCase()
                };
                const filtered = allInventoryData.filter(row => {
                    const rowDate = getDateString(row.tanggal_perolehan);
                    return (!f.nama || String(row.nama).toLowerCase().includes(f.nama)) &&
                           (!f.tanggal || rowDate === f.tanggal) &&
                           (!f.sumber || String(row.sumber_dana) === f.sumber) &&
                           (!f.kondisi || String(row.kondisi) === f.kondisi) &&
                           (!f.lokasi || String(row.lokasi).toLowerCase().includes(f.lokasi));
                });
                renderInventarisTable(filtered);
            }
            else if (type === 'bantuan') {
                const f = {
                    nama: document.getElementById('filterBantuanNama').value.toLowerCase(),
                    tanggal: document.getElementById('filterBantuanTanggal').value,
                    sumber: document.getElementById('filterBantuanSumber').value
                };
                const filtered = allBantuanData.filter(row => {
                    const rowDate = getDateString(row.tanggal_perolehan);
                    return (!f.nama || String(row.nama_barang).toLowerCase().includes(f.nama)) &&
                           (!f.tanggal || rowDate === f.tanggal) &&
                           (!f.sumber || String(row.sumber_bantuan) === f.sumber);
                });
                renderBantuanTable(filtered);
            }
            else if (type === 'rusak') {
                const f = {
                    nama: document.getElementById('filterRusakNama').value.toLowerCase(),
                    lokasi: document.getElementById('filterRusakLokasi').value.toLowerCase()
                };
                const filtered = allRusakData.filter(row => (!f.nama || String(row.nama_barang).toLowerCase().includes(f.nama)) && (!f.lokasi || String(row.lokasi).toLowerCase().includes(f.lokasi)));
                renderRusakTable(filtered);
            }
            else if (type === 'peminjaman') {
                const f = {
                    nama: document.getElementById('filterPinjamNama').value.toLowerCase(),
                    peminjam: document.getElementById('filterPinjamPeminjam').value
                };
                const filtered = allPeminjamanData.filter(row => (!f.nama || String(row.nama_alat).toLowerCase().includes(f.nama)) && (!f.peminjam || String(row.keterangan_peminjam) === f.peminjam));
                renderPeminjamanTable(filtered);
            }
            else if (type === 'pengeluaran') {
                const f = {
                    nama: document.getElementById('filterKeluarNama').value.toLowerCase(),
                    penerima: document.getElementById('filterKeluarPenerima').value.toLowerCase()
                };
                const filtered = allPengeluaranData.filter(row => (!f.nama || String(row.nama_barang).toLowerCase().includes(f.nama)) && (!f.penerima || String(row.nama_penerima).toLowerCase().includes(f.penerima)));
                renderPengeluaranTable(filtered);
            }
        }

        function resetFilter(type) {
            if (type === 'inventaris') {
                ['filterNama', 'filterTanggal', 'filterSumber', 'filterKondisi', 'filterLokasi'].forEach(id => document.getElementById(id).value = '');
                applyFilter('inventaris');
            } else if (type === 'bantuan') {
                ['filterBantuanNama', 'filterBantuanTanggal', 'filterBantuanSumber'].forEach(id => document.getElementById(id).value = '');
                applyFilter('bantuan');
            } else if (type === 'rusak') {
                ['filterRusakNama', 'filterRusakLokasi'].forEach(id => document.getElementById(id).value = '');
                applyFilter('rusak');
            } else if (type === 'peminjaman') {
                ['filterPinjamNama', 'filterPinjamPeminjam'].forEach(id => document.getElementById(id).value = '');
                applyFilter('peminjaman');
            } else if (type === 'pengeluaran') {
                ['filterKeluarNama', 'filterKeluarPenerima'].forEach(id => document.getElementById(id).value = '');
                applyFilter('pengeluaran');
            }
        }

        function renderInventarisTable(data) {
            const tbody = document.getElementById('tbodyInventaris');
            if (!tbody) return; tbody.innerHTML = '';
            if (data.length === 0) { tbody.innerHTML = `<tr><td colspan="11" class="text-center py-8 text-slate-400 font-bold">Tidak ada data</td></tr>`; return; }
            data.slice(-50).reverse().forEach(row => {
                const tr = document.createElement('tr');
                const tgl = row.timestamp ? formatTanggalID(row.timestamp) : '-';
                const tglPerolehan = formatTanggalID(row.tanggal_perolehan);
                const harga = row.harga ? 'Rp ' + Number(row.harga).toLocaleString('id-ID') : '-';
                const makeLink = (url) => url && url !== '-' ? `<a href="${url}" target="_blank" class="text-indigo-600 hover:underline font-bold text-[10px]">Lihat</a>` : '-';
                tr.innerHTML = `<td>${tgl}</td><td>${row.jenis || '-'}</td><td class="font-bold text-slate-700">${row.nama || '-'}</td><td>${row.kode || '-'}</td><td>${tglPerolehan}</td><td><span class="px-2 py-1 bg-indigo-50 text-indigo-600 rounded-md text-[9px] font-black">${row.sumber_dana || '-'}</span></td><td>${harga}</td><td>${row.kondisi || '-'}</td><td>${row.lokasi || '-'}</td><td>${makeLink(row.bukti_pembelian)}</td><td>${makeLink(row.foto_barang)}</td>`;
                tbody.appendChild(tr);
            });
        }

        function exportToExcel(type) {
            let table, fileName;
            if (type === 'Inventaris') { table = document.getElementById("tableInventaris"); fileName = `Data_Inventaris_${new Date().toISOString().slice(0,10)}.xlsx`; } 
            else if (type === 'Bantuan') { table = document.getElementById("tableBantuan"); fileName = `Data_Bantuan_${new Date().toISOString().slice(0,10)}.xlsx`; } 
            else if (type === 'Rusak') { table = document.getElementById("tableRusak"); fileName = `Data_Barang_Rusak_${new Date().toISOString().slice(0,10)}.xlsx`; } 
            else if (type === 'Peminjaman') { table = document.getElementById("tablePeminjaman"); fileName = `Data_Peminjaman_${new Date().toISOString().slice(0,10)}.xlsx`; }
            else if (type === 'Pengeluaran') { table = document.getElementById("tablePengeluaran"); fileName = `Data_Pengeluaran_${new Date().toISOString().slice(0,10)}.xlsx`; }
            
            const wb = XLSX.utils.table_to_book(table, {sheet: type});
            XLSX.writeFile(wb, fileName);
            showToast(`File Excel ${type} berhasil diunduh!`, "emerald");
        }

        function renderUploadSection(idPrefix, label, isMultiple) {
            const maxText = isMultiple ? ' (Maks. 5 Foto)' : '';
            const acceptType = isMultiple ? 'image/*' : 'image/*,application/pdf';
            const multipleAttr = isMultiple ? 'multiple' : '';
            return `
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-slate-500 uppercase">${label}</label>
                    <div class="upload-area" onclick="document.getElementById('input_${idPrefix}').click()">
                        <div class="upload-placeholder" id="placeholder_${idPrefix}">
                            <i data-lucide="camera" class="w-8 h-8 mx-auto mb-1"></i>
                            <p class="text-xs font-bold">Klik untuk upload${maxText}</p>
                        </div>
                        <div class="preview-grid" id="grid_${idPrefix}"></div>
                    </div>
                    <input type="file" id="input_${idPrefix}" accept="${acceptType}" ${multipleAttr} class="hidden" onchange="handleFileSelect(event, '${idPrefix}', ${isMultiple})">
                    <p class="text-[9px] text-slate-400 font-bold text-right"><span id="count_${idPrefix}">0</span> file dipilih</p>
                </div>
            `;
        }

        async function handleFileSelect(event, idPrefix, isMultiple) {
            const files = Array.from(event.target.files);
            if (isMultiple && files.length > 5) {
                showToast("Maksimal 5 foto yang diizinkan!", "rose");
                event.target.value = '';
                return;
            }
            const grid = document.getElementById(`grid_${idPrefix}`);
            const placeholder = document.getElementById(`placeholder_${idPrefix}`);
            const countLabel = document.getElementById(`count_${idPrefix}`);
            grid.innerHTML = '';
            placeholder.classList.add('hidden');
            
            if (isMultiple) {
                currentImagesBase64 = [];
                for (let i = 0; i < files.length; i++) {
                    const compressed = await compressImage(files[i]);
                    currentImagesBase64.push(compressed);
                    const div = document.createElement('div');
                    div.className = 'preview-item';
                    div.innerHTML = `<img src="${compressed}"><div class="remove-photo-btn" onclick="removeImage('${idPrefix}', ${i}, event)"><i data-lucide="x" class="w-3 h-3"></i></div>`;
                    grid.appendChild(div);
                }
                countLabel.innerText = currentImagesBase64.length;
            } else {
                const compressed = await compressImage(files[0]);
                currentBuktiBase64 = compressed;
                const div = document.createElement('div');
                div.className = 'preview-item';
                div.innerHTML = `<img src="${compressed}"><div class="remove-photo-btn" onclick="removeSingleImage('${idPrefix}', event)"><i data-lucide="x" class="w-3 h-3"></i></div>`;
                grid.appendChild(div);
                countLabel.innerText = "1";
            }
            lucide.createIcons();
        }

        function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width, height = img.height;
                        const maxWidth = 800; 
                        if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.7)); 
                    };
                };
            });
        }

        function removeImage(idPrefix, index, event) {
            event.stopPropagation();
            currentImagesBase64.splice(index, 1);
            const grid = document.getElementById(`grid_${idPrefix}`);
            grid.innerHTML = '';
            currentImagesBase64.forEach((img, i) => {
                const div = document.createElement('div');
                div.className = 'preview-item';
                div.innerHTML = `<img src="${img}"><div class="remove-photo-btn" onclick="removeImage('${idPrefix}', ${i}, event)"><i data-lucide="x" class="w-3 h-3"></i></div>`;
                grid.appendChild(div);
            });
            document.getElementById(`count_${idPrefix}`).innerText = currentImagesBase64.length;
            if (currentImagesBase64.length === 0) document.getElementById(`placeholder_${idPrefix}`).classList.remove('hidden');
            lucide.createIcons();
        }

        function removeSingleImage(idPrefix, event) {
            event.stopPropagation();
            currentBuktiBase64 = "";
            document.getElementById(`grid_${idPrefix}`).innerHTML = '';
            document.getElementById(`placeholder_${idPrefix}`).classList.remove('hidden');
            document.getElementById(`count_${idPrefix}`).innerText = "0";
            document.getElementById(`input_${idPrefix}`).value = '';
        }

        function resetAllUploads() {
            currentImagesBase64 = []; currentBuktiBase64 = "";
            document.querySelectorAll('.preview-grid').forEach(g => g.innerHTML = '');
            document.querySelectorAll('.upload-placeholder').forEach(p => p.classList.remove('hidden'));
            document.querySelectorAll('[id^="count_"]').forEach(c => c.innerText = "0");
            document.querySelectorAll('input[type="file"]').forEach(i => i.value = '');
        }

        async function sendData(payload, btnId, successMsg, color) {
            const btn = document.getElementById(btnId);
            const originalText = btn.innerText;
            btn.disabled = true; btn.innerHTML = `<span class="animate-pulse">Menyimpan & Mengupload...</span>`;
            
            console.log("Mengirim data ke server:", payload);
            
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await response.json();
                console.log("Response dari server:", result);
                
                if (result.status === "success") showToast(successMsg, color);
                else showToast("Gagal: " + result.message, "rose");
            } catch (err) { 
                console.error("Error:", err);
                showToast("Gagal terhubung ke server!", "rose"); 
            }
            finally { btn.disabled = false; btn.innerText = originalText; }
        }

        function showToast(message, color) {
            const toast = document.getElementById('statusToast');
            const content = document.getElementById('toastContent');
            const icon = document.getElementById('toastIcon');
            document.getElementById('toastMessage').textContent = message;
            if (color === 'emerald') {
                content.className = "aero-blur bg-white/95 border border-emerald-500/20 px-6 py-4 rounded-3xl shadow-2xl flex items-center gap-3 text-emerald-600";
                icon.setAttribute('data-lucide', 'check-circle');
            } else if (color === 'amber') {
                content.className = "aero-blur bg-white/95 border border-amber-500/20 px-6 py-4 rounded-3xl shadow-2xl flex items-center gap-3 text-amber-600";
                icon.setAttribute('data-lucide', 'alert-triangle');
            } else {
                content.className = "aero-blur bg-white/95 border border-rose-500/20 px-6 py-4 rounded-3xl shadow-2xl flex items-center gap-3 text-rose-600";
                icon.setAttribute('data-lucide', 'alert-circle');
            }
            lucide.createIcons();
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 4000);
        }

        window.onload = () => {
            const saved = localStorage.getItem('sarpras_session');
            if (saved) { currentUser = JSON.parse(saved); showMainPage(); }
